kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{APP_NAME}}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  env:
    - name: NO_NAV_SECURITY_JWT_ISSUER_AZUREV2_DISCOVERYURL
      value: {{ NO_NAV_SECURITY_JWT_ISSUER_AZUREV2_DISCOVERYURL }}
    - name: NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_DISCOVERYURL
      value: {{ NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_DISCOVERYURL }}
    - name: NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_ACCEPTED_AUDIENCE
      value: {{ NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_ACCEPTED_AUDIENCE }}
    - name: SPRING_LDAP_URLS
      value: {{ SPRING_LDAP_URLS }}
    - name: LDAP_NAVUSER_BASEDN
      value: {{ LDAP_NAVUSER_BASEDN }}
    - name: LDAP_SERVICEUSER_BASEDN
      value: {{ LDAP_SERVICEUSER_BASEDN }}
    - name: LDAP_DOMAIN
      value: {{ LDAP_DOMAIN }}
    - name: LDAP_BASEDN
      value: {{ LDAP_BASEDN }}
    - name: DOKARKIV_ENDPOINTS_PDL_URL
      value: {{ DOKARKIV_ENDPOINTS_PDL_URL }}
    - name: DOKARKIV_ENDPOINTS_SAF_URL
      value: {{ DOKARKIV_ENDPOINTS_SAF_URL }}
    - name: DOKARKIV_ENDPOINTS_SAF_SCOPE
      value: {{ DOKARKIV_ENDPOINTS_SAF_SCOPE }}
    - name: DOKARKIV_DATABASE_POOLSIZE
      value: "{{ DOKARKIV_DATABASE_POOLSIZE }}"
    - name: DOKARKIV_DATABASE_PARALLEL_HINT_SUPPORT
      value: "{{ DOKARKIV_DATABASE_PARALLEL_HINT_SUPPORT }}"
    - name: DOKPRODMELLOMLAGER_PROJECTID
      value: {{ DOKPRODMELLOMLAGER_PROJECTID }}
    - name: DOKPRODMELLOMLAGER_BUCKET
      value: {{ DOKPRODMELLOMLAGER_BUCKET }}
    - name: DOKPRODMELLOMLAGER_KEYRING
      value: {{ DOKPRODMELLOMLAGER_KEYRING }}
    - name: DOKPRODMELLOMLAGER_KEYID
      value: {{ DOKPRODMELLOMLAGER_KEYID }}
    - name: SPRINGDOC_ENABLED
      value: "{{ SPRINGDOC_ENABLED }}"
    - name: AZURE_AD_ADMIN_ROLE
      value: {{ AZURE_AD_ADMIN_ROLE }}
    - name: DOKARKIV_ENDPOINTS_PDL_SCOPE
      value: {{ DOKARKIV_ENDPOINTS_PDL_SCOPE }}
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name={{ ENVIRONMENT }}"
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
    - {{this }}
    {{/each}}
  liveness:
    path: /actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 15
    periodSeconds: 10
  port: 8080
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: 6500Mi
    requests:
      cpu: 100m
      memory: 4400Mi
  vault:
    enabled: true
    paths:
      - kvPath: {{ DOKARKIV_DS_CREDS }}
        mountPath: "/var/run/secrets/nais.io/db_creds"
      - kvPath: {{ DOKARKIV_DS_CONFIG }}
        mountPath: "/var/run/secrets/nais.io/db_config"
      - kvPath: {{ SRVDOKARKIV }}
        mountPath: "/secrets/serviceuser/srvdokarkiv"
      - kvPath: {{ DOKARKIV_VAULT }}
        mountPath: "/var/run/secrets/nais.io/vault"
      - kvPath: {{ SRV_LINUX }}
        mountPath: "/var/run/secrets/nais.io/ldap"
  webproxy: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - "NAVident"
          - "azp_name"
  accessPolicy:
    inbound:
      rules:
    {{#each AZURE_IAC_RULES}}
        - application: {{app}}
          namespace: {{namespace}}
          cluster: {{cluster}}
          permissions:
            {{#if roles}}
            roles:
              {{#each roles}}
              - "{{this}}"
              {{/each}}
            {{/if}}
            {{#if scopes}}
            scopes:
              {{#each scopes}}
              - "{{this}}"
              {{/each}}
            {{/if}}
    {{/each}}
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
      destinations:
        - id: "elastic-apm"
    logging:
      destinations:
        - id: elastic
        - id: loki