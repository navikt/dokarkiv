name: Automerge Dependabot PRs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * MON-FRI'
      timezone: Europe/Oslo

jobs:
  automerge:
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: read
      id-token: write
    uses: navikt/dok-workflows/.github/workflows/automerge-dependabot-pr.yml@main
    secrets: inherit
    with:
      use-app-token: true