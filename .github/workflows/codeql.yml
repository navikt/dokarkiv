name: CodeQL

on:
  schedule:
    - cron: '00 16 * * SUN'

jobs:
  run-codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: navikt/dok-workflows/.github/workflows/codeql.yml@main
    secrets: inherit
    with:
      java-version: '17'
      codeql-version: '2.18.0'