spring.main.banner-mode=off
logging.config=classpath:logback-nais.xml
# tomcat
server.tomcat.min-spare-threads=10
server.tomcat.max-threads=50
# actuators
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus
# mvc
spring.mvc.favicon.enabled=false
# database
spring.datasource.driver-class-name=oracle.jdbc.pool.OracleDataSource
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.session_factory.interceptor=no.nav.dokarkiv.core.domain.interceptor.PersistentDomainObjectHibernateInterceptor
spring.transaction.default-timeout=300s

#
# application configuration
#
behandlejournal.v2.lagreVedleggPaaJournalpost.vedleggDokumentTypeId=458212
behandlejournal.v3.lagreVedleggPaaJournalpost.vedleggDokumentTypeId=458212
innsynjournal.v2.innsyn.earliest.date=2016-06-04
journal.v3.predefinert.antall.saker=50
hentdokument.dokumenturl.urlTimeToLiveMinutes=1
hentdokument.dlf.metadataXmlEncoding=ISO-8859-1
hentdokument.dlf.vedleggUrlTimeToLiveMinutes=480
hentdokument.dlf.vedleggNonSslUrl=true

#
# flyway
#
spring.flyway.enabled=true
spring.flyway.table=schema_version
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=false
# freg security
freg.security.oidc.idp.openAm.hostUrl=${oidc.url}
freg.security.oidc.idp.openAm.issuerUrl=${freg.security.oidc.idp.openAm.hostUrl}/oauth2
freg.security.oidc.idp.openAm.jwksUrl=${freg.security.oidc.idp.openAm.hostUrl}/oauth2/connect/jwk_uri
freg.security.oidc.idp.openAm.loginUrl=${freg.security.oidc.idp.openAm.hostUrl}/oauth2/authorize
freg.security.oidc.auth.securedPath=/rest/**
# Set this to false if you want to disable security while testing on local. Do not commit the change!
freg.security.oidc.auth.enabled=true
