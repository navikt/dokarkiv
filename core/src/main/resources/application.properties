spring.main.banner-mode=off
# server
server.tomcat.threads.min-spare=60
server.tomcat.threads.max=120
server.error.include-message=always
server.error.whitelabel.enabled=false
# server graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# actuators
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus
management.metrics.enable.http.client.requests=false
management.metrics.enable.repository.duration=false
# database
spring.datasource.driver-class-name=oracle.jdbc.pool.OracleDataSource
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.session_factory.interceptor=no.nav.dokarkiv.core.domain.interceptor.PersistentDomainObjectHibernateInterceptor
spring.transaction.default-timeout=300s
# flyway
spring.flyway.enabled=true
spring.flyway.table=schema_version
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=false
# jackson
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.accept-case-insensitive-properties=true
# endepunkt
behandlejournal.v2.lagreVedleggPaaJournalpost.vedleggDokumentTypeId=458212
behandlejournal.v3.lagreVedleggPaaJournalpost.vedleggDokumentTypeId=458212
innsynjournal.v2.innsyn.earliest.date=2016-06-04
journal.v3.predefinert.antall.saker=50
hentdokument.dokumenturl.urlTimeToLiveMinutes=1
hentdokument.dlf.metadataXmlEncoding=ISO-8859-1
hentdokument.dlf.vedleggUrlTimeToLiveMinutes=480
hentdokument.dlf.vedleggNonSslUrl=true
auth.group.lesetilgang.joark=CN=0000-GA-joark-les,OU=AccountGroupNotInRemedy,OU=Groups,OU=NAV,OU=BusinessUnits

# token-support proxy setting
http.proxy.parametername=notused

# Springdoc configuration
springdoc.packages-to-scan=no.nav.dokarkiv.journalpost.v1
springdoc.api-docs.path= /api/v1/api-docs
# For sorting endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha
# For sorting tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha
# Sorting of schemas and their attributes
springdoc.writer-with-order-by-keys=true
springdoc.api-docs.enabled=${springdoc.enabled}
springdoc.swagger-ui.enabled=${springdoc.enabled}
