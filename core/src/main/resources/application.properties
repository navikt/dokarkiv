spring.main.banner-mode=off
# server
server.error.include-message=always
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json
# spring
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.throw-exception-if-no-handler-found=true
# actuators
management.endpoints.web.exposure.include=prometheus,health
# actuator - health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=db
# actuator - metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.http.client.requests=false
management.metrics.enable.repository.duration=false
# database
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.session_factory.interceptor=no.nav.dokarkiv.core.domain.interceptor.PersistentDomainObjectHibernateInterceptor
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.transaction.default-timeout=300s
# flyway
spring.flyway.enabled=true
spring.flyway.table=schema_version
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=false
# jackson
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.accept-case-insensitive-properties=true
# endepunkt
auth.group.lesetilgang.joark=CN=0000-GA-joark-les,OU=AccountGroupNotInRemedy,OU=Groups,OU=NAV,OU=BusinessUnits

# token-support proxy setting
http.proxy.parametername=notused

# Springdoc configuration
springdoc.packages-to-scan=no.nav.dokarkiv.journalpost.v1
springdoc.api-docs.path= /api/v1/api-docs
# For sorting endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha
# For sorting tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha
# Sorting of schemas and their attributes
springdoc.writer-with-order-by-keys=true
springdoc.api-docs.enabled=${springdoc.enabled}
springdoc.swagger-ui.enabled=${springdoc.enabled}
