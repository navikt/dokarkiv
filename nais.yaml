image: "docker.adeo.no:5000/dok/dokarkiv"
replicas:
  min: 2
  max: 10
  cpuThresholdPercentage: 70
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 4000m
    memory: 1536Mi
  requests:
    memory: 1024Mi
fasitResources:
  used:
  - alias: dokarkivds
    resourceType: datasource
    propertyMap:
      url: SPRING_DATASOURCE_URL
      username: SPRING_DATASOURCE_USERNAME
      password: SPRING_DATASOURCE_PASSWORD
  - alias: ldap
    resourceType: ldap
    propertyMap:
      url: SPRING_LDAP_URLS
      username: SPRING_LDAP_USERNAME
      password: SPRING_LDAP_PASSWORD
      serviceuser.basedn: SPRING_LDAP_BASE
