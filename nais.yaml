team: teamdokumenthandtering
image: "repo.adeo.no:5443/dok/dokarkiv"
replicas:
  min: 4
  max: 10
  cpuThresholdPercentage: 50
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 4000m
    memory: 2048Mi
  requests:
    memory: 1280Mi
fasitResources:
  used:
  - alias: freg-security-oidc
    resourceType: OpenIdConnect
    propertyMap:
      hostUrl: freg.security.oidc.idp.openAm.hostUrl
      issuerUrl: freg.security.oidc.idp.openAm.issuerUrl
      jwksUrl: freg.security.oidc.idp.openAm.jwksUrl
  - alias: security-token-service-issuer
    resourceType: BaseUrl
    propertyMap:
      url: freg.security.oidc.idp.navSts.issuerUrl
  - alias: security-token-service-jwks
    resourceType: RestService
    propertyMap:
      url: freg.security.oidc.idp.navSts.jwksUrl
  - alias: dokarkivds
    resourceType: datasource
    propertyMap:
      url: SPRING_DATASOURCE_URL
      username: SPRING_DATASOURCE_USERNAME
      password: SPRING_DATASOURCE_PASSWORD
  - alias: ldap
    resourceType: ldap
    propertyMap:
      url: SPRING_LDAP_URLS
      username: SPRING_LDAP_USERNAME
      password: SPRING_LDAP_PASSWORD
      user.basedn: LDAP_NAVUSER_BASEDN
      serviceuser.basedn: LDAP_SERVICEUSER_BASEDN
  - alias: srvdokarkiv
    resourceType: credential
    propertyMap:
      username: SERVICEUSER_USERNAME
      password: SERVICEUSER_PASSWORD
  - alias: securityTokenService
    resourceType: baseurl
  - alias: Aktoer_v2
    resourceType: webserviceendpoint
    propertyMap:
      endpointUrl: AKTOERV2_URL
  - alias: "abac.pdp.endpoint"
    resourceType: restservice
    propertyMap:
      url: ABAC_URL
  - alias: joarkhentdokumentbaseurl
    resourceType: baseurl
    propertyMap:
      url: JOARK_HENTDOKUMENT_BASEURL
  - alias: dokarkivhentdokumentbaseurl
    resourceType: baseurl
    propertyMap:
      url: DOKARKIV_HENTDOKUMENT_BASEURL
  - alias: dokarkiv_s3_creds
    resourceType: credential
  - alias: dokprodmellomlager_s3_storage_crypto
    resourceType: credential
  exposed:
  - alias: Journal_v3
    resourceType: webserviceendpoint
    path: /services/journal/v3
    wsdlGroupId: no.nav.tjenester
    wsdlArtifactId: nav-journal-v3-tjenestespesifikasjon
    wsdlVersion: 3.1.5
    securityToken: SAML
    description: Virksomhetstjeneste for henting av journalposter og dokumenter fra arkivet.
  - alias: InngaaendeJournal_v1
    resourceType: webserviceendpoint
    path: /services/inngaaendejournal/v1
    wsdlGroupId: no.nav.tjenester
    wsdlArtifactId: nav-inngaaendeJournal-v1-tjenestespesifikasjon
    wsdlVersion: 1.1.3
    securityToken: SAML
    description: Virksomhetstjeneste for henting av metadata om inngående journalposter.
  - alias: BehandleInngaaendeJournal_v1
    resourceType: webserviceendpoint
    path: /services/behandleinngaaendejournal/v1
    wsdlGroupId: no.nav.tjenester
    wsdlArtifactId: nav-behandleInngaaendeJournal-v1-tjenestespesifikasjon
    wsdlVersion: 1.0.1
    securityToken: SAML
    description: Virksomhetstjeneste for oppdatering av inngående journalposter.
  - alias: BehandleJournal_v2
    resourceType: webserviceendpoint
    path: /services/behandlejournal/v2
    wsdlGroupId: no.nav.tjenester.fim
    wsdlArtifactId: nav-fim-behandleJournal-v2-tjenestespesifikasjon
    wsdlVersion: 2.3.0
    securityToken: SAML
    description: Virksomhetstjeneste for midlertidig og endelig journalføring i arkivet.
  - alias: BehandleJournal_v3
    resourceType: webserviceendpoint
    path: /services/behandlejournal/v3
    wsdlGroupId: no.nav.tjenester.fim
    wsdlArtifactId: nav-fim-behandleJournal-v3-tjenestespesifikasjon
    wsdlVersion: 3.0.2
    securityToken: SAML
    description: Virksomhetstjeneste for midlertidig og endelig journalføring i arkivet versjon 3.
  - alias: ArkiverDokumentproduksjon_v1
    resourceType: webserviceendpoint
    path: /services/arkiverdokumentproduksjon/v1
    wsdlGroupId: no.nav.tjenester.brevogarkiv
    wsdlArtifactId: arkiverdokumentproduksjon-tjenestespesifikasjon
    wsdlVersion: 3.2.1
    securityToken: USERNAME_TOKEN
    description: Domenetjeneste for arkivering av dokumenter under produksjon.
  - alias: ArkiverDokumentmottak_v1
    resourceType: webserviceendpoint
    path: /services/arkiverdokumentmottak/v1
    wsdlGroupId: no.nav.tjenester.brevogarkiv
    wsdlArtifactId: arkiverdokumentmottak-tjenestespesifikasjon
    wsdlVersion: 1.1.8
    securityToken: USERNAME_TOKEN
    description: Domenetjeneste for arkivering av dokumenter fra mottak.
  - alias: ArkiverDokumentmottak_v2
    resourceType: webserviceendpoint
    path: /services/arkiverdokumentmottak/v2
    wsdlGroupId: no.nav.tjenester.brevogarkiv
    wsdlArtifactId: arkiverdokumentmottak-tjenestespesifikasjon-v2
    wsdlVersion: 2.1.3
    securityToken: USERNAME_TOKEN
    description: Domenetjeneste for arkivering av dokumenter fra mottak.
  - alias: DokumentproduksjonInfo_v1
    resourceType: webserviceendpoint
    path: /services/dokumentproduksjoninfo/v1
    wsdlGroupId: no.nav.tjenester.brevogarkiv
    wsdlArtifactId: dokumentproduksjoninfo-tjenestespesifikasjon
    wsdlVersion: 2.1.1
    securityToken: USERNAME_TOKEN
    description: Domenetjeneste for uthenting av informasjon ifm. dokumentproduksjon.
  - alias: JournalfoerInngaaende_v1
    resourceType: restservice
    path: /rest/journalfoerinngaaende/v1
    securityToken: OIDC_TOKEN
    description: Rest-tjenester til bruk ifm. manuell journalføring.
  - alias: OppdaterMetadata
    resourceType: restservice
    path: /rest/v1/journalpost/{journalpostId}
    description: Tjeneste som oppdaterer metadata på en journalpost med tilhørende dokumenter i Joark.