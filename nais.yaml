image: "docker.adeo.no:5000/dok/dokarkiv"
replicas:
  min: 2
  max: 6
  cpuThresholdPercentage: 70
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 4000m
    memory: 1024Mi
  requests:
    memory: 512Mi
fasitResources:
  used:
  - alias: joarkds
    resourceType: datasource
    propertyMap:
      url: SPRING_DATASOURCE_URL
      username: SPRING_DATASOURCE_USERNAME
      password: SPRING_DATASOURCE_PASSWORD
