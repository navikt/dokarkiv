image: "docker.adeo.no:5000/dok/dokarkiv"
replicas:
  min: 2
  max: 10
  cpuThresholdPercentage: 70
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 4000m
    memory: 1536Mi
  requests:
    memory: 1024Mi
fasitResources:
  used:
  - alias: dokarkivds
    resourceType: datasource
    propertyMap:
      url: SPRING_DATASOURCE_URL
      username: SPRING_DATASOURCE_USERNAME
      password: SPRING_DATASOURCE_PASSWORD
  - alias: ldap
    resourceType: ldap
    propertyMap:
      url: SPRING_LDAP_URLS
      username: SPRING_LDAP_USERNAME
      password: SPRING_LDAP_PASSWORD
      user.basedn: LDAP_NAVUSER_BASEDN
      serviceuser.basedn: LDAP_SERVICEUSER_BASEDN
  - alias: srvdokarkiv
    resourceType: credential
    propertyMap:
      username: SERVICEUSER_USERNAME
      password: SERVICEUSER_PASSWORD
  - alias: securityTokenService
    resourceType: baseurl
  - alias: Aktoer_v2
    resourceType: webserviceendpoint
    propertyMap:
      endpointUrl: AKTOERV2_URL
  - alias: "abac.pdp.endpoint"
    resourceType: restservice
    propertyMap:
      url: ABAC_URL
  - alias: joarkhentdokumentbaseurl
    resourceType: baseurl
    propertyMap:
      url: JOARK_HENTDOKUMENT_BASEURL
  - alias: dokarkivhentdokumentbaseurl
    resourceType: baseurl
    propertyMap:
      url: DOKARKIV_HENTDOKUMENT_BASEURL
  exposed:
  - alias: BehandleJournal_v2
    resourceType: webserviceendpoint
    path: /services/behandlejournal/v2
    wsdlGroupId: no.nav.tjenester.fim
    wsdlArtifactId: nav-fim-behandleJournal-v2-tjenestespesifikasjon
    wsdlVersion: 2.3.0
    securityToken: SAML
    description: Virksomhetstjeneste for midlertidig og endelig journalføring i arkivet.
  - alias: ArkiverDokumentproduksjon_v1
    resourceType: webserviceendpoint
    path: /services/arkiverdokumentproduksjon/v1
    wsdlGroupId: no.nav.tjenester.brevogarkiv
    wsdlArtifactId: arkiverdokumentproduksjon-tjenestespesifikasjon
    wsdlVersion: 3.2.1
    securityToken: USERNAME_TOKEN
    description: Domenetjeneste for arkivering av dokumenter under produksjon.
  - alias: ArkiverDokumentmottak_v1
    resourceType: webserviceendpoint
    path: /services/arkiverdokumentmottak/v1
    wsdlGroupId: no.nav.tjenester.brevogarkiv
    wsdlArtifactId: arkiverdokumentmottak-tjenestespesifikasjon
    wsdlVersion: 1.1.8
    securityToken: USERNAME_TOKEN
    description: Domenetjeneste for arkivering av dokumenter fra mottak.
  - alias: ArkiverDokumentmottak_v2
    resourceType: webserviceendpoint
    path: /services/arkiverdokumentmottak/v2
    wsdlGroupId: no.nav.tjenester.brevogarkiv
    wsdlArtifactId: arkiverdokumentmottak-tjenestespesifikasjon-v2
    wsdlVersion: 2.1.3
    securityToken: USERNAME_TOKEN
    description: Domenetjeneste for arkivering av dokumenter fra mottak.
  - alias: DokumentproduksjonInfo_v1
    resourceType: webserviceendpoint
    path: /services/dokumentproduksjoninfo/v1
    wsdlGroupId: no.nav.tjenester.brevogarkiv
    wsdlArtifactId: dokumentproduksjoninfo-tjenestespesifikasjon
    wsdlVersion: 2.1.1
    securityToken: USERNAME_TOKEN
    description: Domenetjeneste for uthenting av informasjon ifm. dokumentproduksjon.
